services:
  next-app:
    build:
      context: ./next-app
      dockerfile: prod.Dockerfile
      args:
        ENV_VARIABLE: ${ENV_VARIABLE}
        NEXT_PUBLIC_ENV_VARIABLE: ${NEXT_PUBLIC_ENV_VARIABLE}

    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_ENV: production

    restart: always

    networks:
      - proxy

networks:
  proxy:
    external: true
    name: dokploy_network
