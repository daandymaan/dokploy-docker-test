services:
  next-app:
    build:
      context: ./next-app
      dockerfile: prod.Dockerfile
      args:
        ENV_VARIABLE: ${ENV_VARIABLE}
        NEXT_PUBLIC_ENV_VARIABLE: ${NEXT_PUBLIC_ENV_VARIABLE}

    restart: always

    networks:
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy_network"

      - "traefik.http.routers.basic-nextjs.rule=Host(`your-domain.com`)"
      - "traefik.http.routers.basic-nextjs.entrypoints=websecure"
      - "traefik.http.routers.basic-nextjs.tls=true"
      - "traefik.http.routers.basic-nextjs.tls.certresolver=letsencrypt"
      - "traefik.http.routers.basic-nextjs.service=basic-nextjs"

      - "traefik.http.services.basic-nextjs.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
    name: dokploy_network
